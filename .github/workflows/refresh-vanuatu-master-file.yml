name: Refresh Vanuatu Master File snapshot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-vanuatu-master-file.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate source and exact field approval without committing
        type: boolean
        default: true

# Manual refreshes and changes to this workflow refresh the approved Vanuatu source.
# Existing Vanuatu credentials and field approval rules remain authoritative.
permissions:
  contents: write
concurrency:
  group: refresh-vanuatu-master-file
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install google-api-python-client google-auth cryptography
      - name: Test Vanuatu schema, privacy and model
        run: |
          python3 -m unittest discover -s tests -p 'vanuatu_export_test.py'
          node tests/vanuatu-model.test.cjs
          node tests/vanuatu-backend.test.cjs
      - name: Read, validate and sanitize Vanuatu source
        env:
          VANUATU_GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.VANUATU_GOOGLE_SERVICE_ACCOUNT_JSON }}
          VAVELAB_VANUATU_PASSCODE: ${{ secrets.VAVELAB_VANUATU_PASSCODE }}
          VAVELAB_VANUATU_COLLABORATOR_PASSCODE: ${{ secrets.VAVELAB_VANUATU_COLLABORATOR_PASSCODE }}
          VANUATU_ENRICHMENT_FILE_ID: ${{ secrets.VANUATU_ENRICHMENT_FILE_ID }}
          VAN_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: |
          set -euo pipefail
          if [ "$VAN_DRY_RUN" = "true" ]; then
            python3 scripts/vanuatu_master_file_transformer.py --dry-run
          else
            python3 scripts/vanuatu_master_file_transformer.py --out-dir=data
          fi
      - name: Commit only the validated Vanuatu snapshot
        if: github.event_name == 'push' || inputs.dry_run == false
        run: |
          set -euo pipefail
          git config user.name 'Vave Lab Vanuatu snapshot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/vanuatu-master-bundle.json.enc
          if [ -f data/vanuatu-collaborator-bundle.json.enc ]; then
            git add -- data/vanuatu-collaborator-bundle.json.enc
          fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data: refresh validated Vanuatu Master snapshot'
          git pull --rebase origin main
          git push origin HEAD:main

