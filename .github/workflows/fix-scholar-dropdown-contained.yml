name: Fix scholar geography dropdown containment

on:
  push:
    paths:
      - '.github/workflows/fix-scholar-dropdown-contained.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch s.html dropdown containment
        shell: python
        run: |
          from pathlib import Path
          p = Path('s.html')
          s = p.read_text(encoding='utf-8')

          old_toolbar = ".scholar-geo-toolbar{display:block!important;position:absolute!important;top:10px!important;right:12px!important;width:195px!important;max-width:195px!important;overflow:visible!important;z-index:20!important;box-sizing:border-box!important}"
          new_toolbar = ".scholar-geo-toolbar{display:block!important;position:absolute!important;top:10px!important;right:12px!important;width:195px!important;max-width:195px!important;overflow:visible!important;z-index:20!important;box-sizing:border-box!important}\n          .scholar-pubs-review__list>.db-item:has(details.scholar-geo-menu[open]){padding-right:390px!important}\n          .scholar-pubs-review__list>.db-item:has(details.scholar-geo-menu[open]) .scholar-geo-toolbar{width:360px!important;max-width:360px!important}\n          .scholar-pubs-review__list>.db-item:has(details.scholar-geo-menu[open]) details.scholar-geo-menu>summary{width:195px!important;margin-left:auto!important}"
          if old_toolbar not in s:
              raise SystemExit('Toolbar CSS target not found; refusing unsafe patch')
          s = s.replace(old_toolbar, new_toolbar, 1)

          old_opts = ".scholar-geo-options{position:absolute!important;z-index:30!important;top:calc(100% + 7px)!important;left:auto!important;right:0!important;width:360px!important;max-width:min(360px,calc(100vw - 56px))!important;max-height:210px!important;overflow-y:auto!important;overflow-x:hidden!important;box-sizing:border-box!important;margin:0!important;padding:8px!important;background:#fff!important;border:1px solid #cbd5d8!important;border-radius:10px!important;box-shadow:0 8px 22px rgba(0,0,0,.12)!important;text-align:left!important}"
          new_opts = ".scholar-geo-options{position:relative!important;z-index:30!important;top:auto!important;left:auto!important;right:auto!important;width:360px!important;min-width:360px!important;max-width:360px!important;max-height:210px!important;overflow-y:auto!important;overflow-x:hidden!important;box-sizing:border-box!important;margin:7px 0 0!important;padding:8px!important;background:#fff!important;border:1px solid #cbd5d8!important;border-radius:10px!important;box-shadow:0 8px 22px rgba(0,0,0,.12)!important;text-align:left!important}"
          if old_opts not in s:
              raise SystemExit('Options CSS target not found; refusing unsafe patch')
          s = s.replace(old_opts, new_opts, 1)

          p.write_text(s, encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add s.html
          git commit -m "Contain expanded scholar geography dropdowns inside publication cards"
          git push
