name: Stack scholar geography controls

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stack-scholar-geo-controls-20260912.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch scholar review publication geography layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('s.html')
          s=p.read_text(encoding='utf-8')

          # Closed state: reserve a narrow right rail only; no large horizontal toolbar.
          s=s.replace(".scholar-pubs-review__list>.db-item{margin:0!important;width:auto!important;max-width:none!important;position:relative!important;overflow:hidden!important;box-sizing:border-box!important;padding-right:505px!important}",
                      ".scholar-pubs-review__list>.db-item{margin:0!important;width:auto!important;max-width:none!important;position:relative!important;overflow:hidden!important;box-sizing:border-box!important;padding-right:225px!important}")
          s=s.replace(".scholar-pubs-review__list>.db-item:has(.scholar-geo-menu[open]){padding-bottom:235px!important}\n","")

          old_toolbar=""".scholar-geo-toolbar{display:flex!important;align-items:center!important;justify-content:flex-end!important;gap:7px!important;flex-wrap:nowrap!important;position:absolute!important;top:10px!important;right:12px!important;max-width:500px!important;overflow:visible!important;z-index:20!important}
          .scholar-geo-toolbar .scholar-geo-editor__row{display:flex!important;align-items:center!important;gap:7px!important;flex-wrap:nowrap!important;overflow:visible!important}"""
          new_toolbar=""".scholar-geo-toolbar{display:block!important;position:absolute!important;top:10px!important;right:12px!important;width:195px!important;max-width:195px!important;overflow:visible!important;z-index:20!important}
          .scholar-geo-toolbar .scholar-geo-editor__row{display:flex!important;flex-direction:column!important;align-items:stretch!important;gap:8px!important;width:100%!important;overflow:visible!important}
          .scholar-geo-toolbar .scholar-geo-editor__row>details,.scholar-geo-toolbar .scholar-geo-editor__row>.scholar-geo-other{width:100%!important;max-width:100%!important;box-sizing:border-box!important}
          .scholar-geo-editor__row.has-open-menu>*:not(.is-open-menu){display:none!important}
          .scholar-geo-editor__row.has-other-open>details{display:none!important}
          .scholar-pubs-review__list>.db-item:has(.scholar-geo-menu[open]),.scholar-pubs-review__list>.db-item:has(.scholar-geo-editor__row.has-other-open){min-height:310px!important}"""
          if old_toolbar not in s: raise SystemExit('toolbar CSS block not found')
          s=s.replace(old_toolbar,new_toolbar,1)

          old_other=""".scholar-geo-other{display:inline-flex!important;align-items:center!important;height:34px!important;min-height:34px!important;width:150px!important;box-sizing:border-box!important;padding:0 12px!important;border:1px solid #cbd5d8!important;border-radius:999px!important;background:#fff!important;color:#174852!important;font-family:inherit!important;font-size:.8rem!important;font-weight:600!important;line-height:1!important;outline:none!important;}
          .scholar-geo-other::placeholder{color:#174852!important;opacity:1!important}.scholar-geo-other:focus{border-color:#0e7490!important;box-shadow:0 0 0 2px rgba(14,116,144,.10)!important;width:190px!important;}"""
          new_other=""".scholar-geo-other{display:block!important;height:34px!important;min-height:34px!important;width:100%!important;box-sizing:border-box!important;padding:8px 12px!important;border:1px solid #cbd5d8!important;border-radius:999px!important;background:#fff!important;color:#174852!important;font-family:inherit!important;font-size:.8rem!important;font-weight:600!important;line-height:1.2!important;outline:none!important;resize:none!important;overflow:hidden!important;}
          .scholar-geo-other::placeholder{color:#174852!important;opacity:1!important}.scholar-geo-editor__row.has-other-open .scholar-geo-other{height:210px!important;border-radius:12px!important;overflow:auto!important;white-space:pre-wrap!important;border-color:#0e7490!important;box-shadow:0 0 0 2px rgba(14,116,144,.10)!important;}"""
          if old_other not in s: raise SystemExit('other-country CSS block not found')
          s=s.replace(old_other,new_other,1)

          old_options=""".scholar-geo-options{position:absolute!important;z-index:80!important;top:calc(100% + 6px)!important;right:0!important;width:250px!important;max-width:min(250px,calc(100vw - 28px))!important;max-height:210px!important;overflow:auto!important;padding:8px;background:#fff;border:1px solid #cbd5d8;border-radius:10px;box-shadow:0 10px 24px rgba(0,0,0,.22)}"""
          new_options=""".scholar-geo-options{position:relative!important;z-index:1!important;top:auto!important;left:auto!important;right:auto!important;width:100%!important;max-width:100%!important;max-height:220px!important;overflow:auto!important;box-sizing:border-box!important;margin-top:7px!important;padding:8px;background:#fff;border:1px solid #cbd5d8;border-radius:10px;box-shadow:none!important}"""
          if old_options not in s: raise SystemExit('options CSS block not found')
          s=s.replace(old_options,new_options,1)

          old_mobile="""@media(max-width:700px){.scholar-direct-about,.scholar-pubs-review__head{padding:14px 15px}.scholar-geo-submit__grid{grid-template-columns:1fr}.scholar-direct-main .db-kpis{grid-template-columns:1fr!important}.scholar-direct-main .db-kpi--solid .db-kpi__label{font-size:16px!important}.scholar-pubs-review__list>.db-item{padding-right:14px!important;padding-top:58px!important}.scholar-geo-toolbar{left:12px!important;right:12px!important;max-width:none!important;justify-content:flex-start!important;flex-wrap:wrap!important}}"""
          new_mobile="""@media(max-width:700px){.scholar-direct-about,.scholar-pubs-review__head{padding:14px 15px}.scholar-geo-submit__grid{grid-template-columns:1fr}.scholar-direct-main .db-kpis{grid-template-columns:1fr!important}.scholar-direct-main .db-kpi--solid .db-kpi__label{font-size:16px!important}.scholar-pubs-review__list>.db-item{padding-right:14px!important;padding-top:130px!important}.scholar-geo-toolbar{left:12px!important;right:12px!important;top:10px!important;width:auto!important;max-width:none!important}.scholar-geo-toolbar .scholar-geo-editor__row{display:grid!important;grid-template-columns:1fr!important}}"""
          if old_mobile not in s: raise SystemExit('mobile CSS block not found')
          s=s.replace(old_mobile,new_mobile,1)

          old_input="""var otherCountries=d.createElement('input');otherCountries.type='text';otherCountries.className='scholar-geo-other';otherCountries.placeholder='Other countries';otherCountries.setAttribute('aria-label','Other countries; separate multiple countries with semicolons');otherCountries.title='Enter countries outside the Pacific, separated by semicolons (e.g. Jamaica; China)';row.appendChild(otherCountries);otherCountries.addEventListener('input',function(){markDirty();});"""
          new_input="""var otherCountries=d.createElement('textarea');otherCountries.rows=1;otherCountries.className='scholar-geo-other';otherCountries.placeholder='Other countries';otherCountries.setAttribute('aria-label','Other countries; separate multiple countries with semicolons');otherCountries.title='Enter countries outside the Pacific, separated by semicolons (e.g. Jamaica; China)';row.appendChild(otherCountries);otherCountries.addEventListener('focus',function(){Array.prototype.slice.call(row.querySelectorAll('details.scholar-geo-menu[open]')).forEach(function(m){m.open=false;});row.classList.remove('has-open-menu');row.classList.add('has-other-open');});otherCountries.addEventListener('blur',function(){setTimeout(function(){row.classList.remove('has-other-open');},120);});otherCountries.addEventListener('input',function(){markDirty();});"""
          if old_input not in s: raise SystemExit('other countries JS block not found')
          s=s.replace(old_input,new_input,1)

          # Replace viewport/floating positioning with in-card accordion behavior.
          pattern=re.compile(r"var win=d\.defaultView;function values\(\)\{return Array\.prototype\.slice\.call\(panel\.querySelectorAll\('input:checked'\)\)\.map\(function\(c\)\{return c\.value;\}\);\}function syncCount\(\)\{var n=values\(\)\.length;details\.classList\.toggle\('has-selection',n>0\);summary\.querySelector\('\.scholar-geo-menu__count'\)\.textContent=n;\}function positionPanel\(\)\{.*?syncCount\(\);return\{details:details,values:values\};",re.S)
          repl="""function values(){return Array.prototype.slice.call(panel.querySelectorAll('input:checked')).map(function(c){return c.value;});}function syncCount(){var n=values().length;details.classList.toggle('has-selection',n>0);summary.querySelector('.scholar-geo-menu__count').textContent=n;}
        details.addEventListener('toggle',function(){var row=details.parentElement;if(!row)return;if(details.open){Array.prototype.slice.call(row.querySelectorAll('details.scholar-geo-menu[open]')).forEach(function(other){if(other!==details)other.open=false;});var other=row.querySelector('.scholar-geo-other');if(other&&row.classList.contains('has-other-open'))other.blur();Array.prototype.slice.call(row.children).forEach(function(el){el.classList.remove('is-open-menu');});details.classList.add('is-open-menu');row.classList.add('has-open-menu');}else{details.classList.remove('is-open-menu');if(!row.querySelector('details.scholar-geo-menu[open]'))row.classList.remove('has-open-menu');}});syncCount();return{details:details,values:values};"""
          s2,n=pattern.subn(repl,s,count=1)
          if n!=1: raise SystemExit(f'check-menu JS block replacement count={n}')
          s=s2

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'Ron Vave'
          git config user.email 'ronvave2015@gmail.com'
          git add s.html
          git commit -m 'Stack publication geography controls and use in-card accordions'
          git push
