name: Close scholar geography dropdown on outside click

on:
  push:
    paths:
      - '.github/workflows/patch-scholar-dropdown-outside-click-20260912.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch s.html outside-click behavior
        shell: python
        run: |
          from pathlib import Path
          p = Path('s.html')
          s = p.read_text(encoding='utf-8')

          old = """        prepareScholarPublicationFilter(w, state, scholarKey);\n        buildPublicationReviewWhenReady(w, d, main, state, scholarId, scholarKey, scholarName, card);\n      }\n\n      function injectStyles(d) {"""
          new = """        prepareScholarPublicationFilter(w, state, scholarKey);\n        buildPublicationReviewWhenReady(w, d, main, state, scholarId, scholarKey, scholarName, card);\n        installGeoDropdownOutsideClick(d);\n      }\n\n      function installGeoDropdownOutsideClick(d) {\n        if (!d || d.documentElement.dataset.geoOutsideClickInstalled === '1') return;\n        d.documentElement.dataset.geoOutsideClickInstalled = '1';\n\n        d.addEventListener('click', function (event) {\n          var target = event.target;\n          var openMenus = d.querySelectorAll('details.scholar-geo-menu[open]');\n          if (!openMenus.length) return;\n\n          openMenus.forEach(function (menu) {\n            if (!menu.contains(target)) menu.removeAttribute('open');\n          });\n        });\n      }\n\n      function injectStyles(d) {"""

          if old not in s:
              raise SystemExit('Target snippet not found; refusing unsafe patch')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add s.html
          git commit -m "Close scholar geography dropdowns on outside click"
          git push
