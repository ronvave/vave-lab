name: Patch scholar review other countries

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-scholar-other-countries-20260912.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch scholar review page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('s.html')
          s = p.read_text(encoding='utf-8')

          s = s.replace(
            ".scholar-pubs-review__list>.db-item{margin:0!important;width:auto!important;max-width:none!important;position:relative!important;overflow:hidden!important;box-sizing:border-box!important;padding-right:430px!important}",
            ".scholar-pubs-review__list>.db-item{margin:0!important;width:auto!important;max-width:none!important;position:relative!important;overflow:hidden!important;box-sizing:border-box!important;padding-right:590px!important}"
          )
          s = s.replace(
            ".scholar-geo-toolbar{display:flex!important;align-items:center!important;justify-content:flex-end!important;gap:7px!important;flex-wrap:nowrap!important;position:absolute!important;top:10px!important;right:12px!important;max-width:410px!important;overflow:visible!important;z-index:20!important}",
            ".scholar-geo-toolbar{display:flex!important;align-items:center!important;justify-content:flex-end!important;gap:7px!important;flex-wrap:nowrap!important;position:absolute!important;top:10px!important;right:12px!important;max-width:570px!important;overflow:visible!important;z-index:20!important}"
          )
          css_marker = ".scholar-geo-toolbar>a{display:inline-flex!important;align-items:center!important;justify-content:center!important;height:34px!important;min-height:34px!important;box-sizing:border-box!important;padding:0 12px!important;border-radius:999px!important;font-size:.8rem!important;line-height:1!important;font-weight:600!important;white-space:nowrap!important;}"
          css_add = css_marker + "\n          .scholar-geo-other{display:inline-flex!important;align-items:center!important;height:34px!important;min-height:34px!important;width:150px!important;box-sizing:border-box!important;padding:0 12px!important;border:1px solid #cbd5d8!important;border-radius:999px!important;background:#fff!important;color:#174852!important;font-family:inherit!important;font-size:.8rem!important;font-weight:600!important;line-height:1!important;outline:none!important;}\n          .scholar-geo-other::placeholder{color:#174852!important;opacity:1!important}.scholar-geo-other:focus{border-color:#0e7490!important;box-shadow:0 0 0 2px rgba(14,116,144,.10)!important;width:190px!important;}"
          if css_marker in s and ".scholar-geo-other{" not in s:
              s = s.replace(css_marker, css_add, 1)

          old_head = "Where relevant, you can also identify another Pacific Island country or territory where the research was undertaken.</p><p>Geotagging allows publications"
          new_head = "Where relevant, you can also identify another Pacific Island country or territory where the research was undertaken. For research undertaken outside the Pacific, use <strong>Other countries</strong> and enter country names separated by semicolons (for example, <strong>Jamaica; China</strong>).</p><p>Geotagging allows publications"
          s = s.replace(old_head, new_head, 1)

          old_country = "var countryMenu=buildCheckMenu(d,'Pacific Island country',PACIFIC_COUNTRIES.map(function(c){return{value:c,label:c};}),new Set(),function(){markDirty();});countryMenu.details.dataset.kind='country';row.appendChild(countryMenu.details);\n        var status=d.createElement('div');"
          new_country = "var countryMenu=buildCheckMenu(d,'Pacific Island country',PACIFIC_COUNTRIES.map(function(c){return{value:c,label:c};}),new Set(),function(){markDirty();});countryMenu.details.dataset.kind='country';row.appendChild(countryMenu.details);\n        var otherCountries=d.createElement('input');otherCountries.type='text';otherCountries.className='scholar-geo-other';otherCountries.placeholder='Other countries';otherCountries.setAttribute('aria-label','Other countries; separate multiple countries with semicolons');otherCountries.title='Enter countries outside the Pacific, separated by semicolons (e.g. Jamaica; China)';row.appendChild(otherCountries);otherCountries.addEventListener('input',function(){markDirty();});\n        var status=d.createElement('div');"
          if old_country not in s:
              raise SystemExit('country menu marker not found')
          s = s.replace(old_country, new_country, 1)

          old_dirty = "function markDirty(){var provinces=provinceMenu.values();var countries=countryMenu.values();dirty.set(item.key,{item_key:item.key,title:item.title||'',year:item.year||'',provinces:provinces,pacific_countries:countries});status.textContent='Geographic suggestion changed — it will be included when you submit below.';updateDirtyCounter(d,dirty.size);}return wrap;"
          new_dirty = "function markDirty(){var provinces=provinceMenu.values();var countries=countryMenu.values();var other=String(otherCountries.value||'').split(';').map(function(v){return v.trim();}).filter(Boolean).filter(function(v,i,a){return a.indexOf(v)===i;});dirty.set(item.key,{item_key:item.key,title:item.title||'',year:item.year||'',provinces:provinces,pacific_countries:countries,other_countries:other});status.textContent='Geographic suggestion changed — it will be included when you submit below.';updateDirtyCounter(d,dirty.size);}return wrap;"
          if old_dirty not in s:
              raise SystemExit('markDirty marker not found')
          s = s.replace(old_dirty, new_dirty, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and push
        run: |
          git config user.name 'Ron Vave'
          git config user.email 'ronvave2011@gmail.com'
          git add s.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add other-country tagging to scholar publication review'
          git push
