name: Refresh iTaukei Zotero snapshot

# Runs every 3 hours and any time you want to trigger manually from the
# Actions tab. Regenerates data/itaukei-zotero-snapshot.json from the public
# Zotero API, compares against the version in the repo, and commits + pushes
# only if any critical total (total items, journalArticle, thesis, bookSection,
# report, book, Burebasaga, Kubuna, Tovata, non-Fiji iTaukei) has shifted by
# MORE than 2%. Small drift is ignored so we don't spam commits.

on:
  schedule:
    - cron: '0 */3 * * *'  # every 3 hours, UTC
  workflow_dispatch:        # manual "Run workflow" button in the Actions tab

permissions:
  contents: write            # required to push commits back to main

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Regenerate snapshot from Zotero API
        run: |
          python3 data/refresh-zotero-snapshot.py

      - name: Compare vs previous snapshot & write last-sync tracker
        id: diff
        run: |
          python3 - <<'PY'
          """
          Diff the newly regenerated snapshot against the git-tracked version.
          Always update data/last-sync.json with the current check timestamp so
          the public site's Sync badge advances every run, even when nothing
          material changed. The snapshot file itself is only rewritten when a
          tracked total moves by more than 2% (to keep commit history clean).
          """
          import json, os, subprocess, sys, datetime

          NEW_PATH  = "data/itaukei-zotero-snapshot.json"
          SYNC_PATH = "data/last-sync.json"

          # 1. Load the freshly written snapshot (working tree)
          with open(NEW_PATH, "r") as f:
              new = json.load(f)

          # 2. Load the previous snapshot from git (HEAD)
          try:
              prev_raw = subprocess.check_output(
                  ["git", "show", f"HEAD:{NEW_PATH}"], text=True
              )
              prev = json.loads(prev_raw)
              has_prev = True
          except subprocess.CalledProcessError:
              prev = None
              has_prev = False

          # 3. Load geo file to compute confederacy tallies
          with open("data/fiji-provinces.geojson") as f:
              geo = json.load(f)
          prov_conf = {}
          for feat in geo["features"]:
              p = feat["properties"]
              key = p.get("zoteroCollectionKey_publicationLocation")
              if key:
                  prov_conf[key] = p["confederacy"]

          # Helper: compute the totals we care about from any snapshot
          def totals(snap):
              items = snap["items"]
              out = {"items": len(items)}
              from collections import Counter
              tc = Counter(i.get("itemType", "?") for i in items)
              for t in ("journalArticle", "thesis", "bookSection", "book", "report"):
                  out[f"type:{t}"] = tc.get(t, 0)
              conf = {"Burebasaga": 0, "Kubuna": 0, "Tovata": 0}
              for it in items:
                  for k in it.get("collections", []):
                      c = prov_conf.get(k)
                      if c:
                          conf[c] += 1
              for c, n in conf.items():
                  out[f"conf:{c}"] = n
              return out

          new_t  = totals(new)
          prev_t = totals(prev) if has_prev else {k: 0 for k in new_t}

          # 4. Compare with a 2% threshold
          THRESHOLD_PCT = 2.0
          rows = []
          data_changed = not has_prev
          moved = []
          for key in sorted(set(prev_t) | set(new_t)):
              a = prev_t.get(key, 0)
              b = new_t.get(key, 0)
              denom = max(1, a)
              pct = abs(b - a) / denom * 100.0
              flag = "*" if pct > THRESHOLD_PCT and b != a else " "
              if flag == "*":
                  data_changed = True
                  moved.append({"metric": key, "prev": a, "new": b, "delta": b - a, "pct": round(pct, 2)})
              rows.append(f"  {flag} {key:20s}  prev={a:>4}  new={b:>4}  delta={b-a:+d}  ({pct:5.2f}%)")

          print("=== Snapshot delta ===")
          print("\n".join(rows))
          print(f"=== Threshold: {THRESHOLD_PCT}% ===")
          print(f"=== data_changed: {data_changed} ===")

          # 5. Determine "last data change" ISO timestamp (carry forward if no change)
          now_iso = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          prev_sync = {}
          try:
              prev_sync_raw = subprocess.check_output(
                  ["git", "show", f"HEAD:{SYNC_PATH}"], text=True
              )
              prev_sync = json.loads(prev_sync_raw)
          except subprocess.CalledProcessError:
              prev_sync = {}

          last_changed = now_iso if data_changed else prev_sync.get("lastChanged") or new.get("generatedAt") or now_iso

          # 6. Write the always-fresh sync tracker
          summary = ("No tracked total moved by more than "
                     f"{THRESHOLD_PCT}%.") if not moved else (
              "Changes: " + ", ".join(f"{m['metric']} {m['prev']}→{m['new']}" for m in moved)
          )
          with open(SYNC_PATH, "w") as f:
              json.dump({
                  "lastChecked": now_iso,
                  "lastChanged": last_changed,
                  "dataChangedThisRun": data_changed,
                  "totalItems": new_t.get("items", 0),
                  "movedMetrics": moved,
                  "summary": summary,
                  "threshold": f"{THRESHOLD_PCT}%",
                  "workflowRunUrl": f"https://github.com/{os.environ.get('GITHUB_REPOSITORY','')}/actions/runs/{os.environ.get('GITHUB_RUN_ID','')}"
              }, f, indent=2)

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"data_changed={'true' if data_changed else 'false'}\n")
          PY

      - name: Commit and push
        run: |
          # last-sync.json is always updated; snapshot only when data moved.
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ steps.diff.outputs.data_changed }}" = "true" ]; then
            git add data/itaukei-zotero-snapshot.json data/last-sync.json
            git commit -m "Auto-refresh Zotero snapshot ($(date -u +%Y-%m-%d\ %H:%M\ UTC))

          One or more tracked totals moved by >2% since the last snapshot.
          Run: ${{ github.run_id }}"
          else
            git add data/last-sync.json
            # No data change; commit only the sync heartbeat. --allow-empty
            # is unnecessary because last-sync.json's timestamp always changes.
            git commit -m "chore: refresh last-sync heartbeat ($(date -u +%Y-%m-%d\ %H:%M\ UTC))

          No tracked total moved by >2% — snapshot file unchanged.
          Run: ${{ github.run_id }}"
          fi
          git push origin HEAD:${{ github.ref_name }}
