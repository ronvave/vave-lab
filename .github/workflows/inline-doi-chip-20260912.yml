name: Inline DOI chip on scholar review cards

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inline-doi-chip-20260912.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch scholar review layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('s.html')
          s = p.read_text(encoding='utf-8')

          s = s.replace(
            ".scholar-pubs-review__list>.db-item{margin:0!important;width:auto!important;max-width:none!important;position:relative!important;overflow:hidden!important;box-sizing:border-box!important;padding-right:590px!important}",
            ".scholar-pubs-review__list>.db-item{margin:0!important;width:auto!important;max-width:none!important;position:relative!important;overflow:hidden!important;box-sizing:border-box!important;padding-right:505px!important}"
          )
          s = s.replace(
            ".scholar-geo-toolbar{display:flex!important;align-items:center!important;justify-content:flex-end!important;gap:7px!important;flex-wrap:nowrap!important;position:absolute!important;top:10px!important;right:12px!important;max-width:570px!important;overflow:visible!important;z-index:20!important}",
            ".scholar-geo-toolbar{display:flex!important;align-items:center!important;justify-content:flex-end!important;gap:7px!important;flex-wrap:nowrap!important;position:absolute!important;top:10px!important;right:12px!important;max-width:500px!important;overflow:visible!important;z-index:20!important}"
          )

          marker = ".scholar-geo-toolbar>a{display:inline-flex!important;align-items:center!important;justify-content:center!important;height:34px!important;min-height:34px!important;box-sizing:border-box!important;padding:0 12px!important;border-radius:999px!important;font-size:.8rem!important;line-height:1!important;font-weight:600!important;white-space:nowrap!important;}\n"
          extra = ".scholar-review-doi-chip{display:inline-flex!important;align-items:center!important;justify-content:center!important;padding:4px 10px!important;border-radius:999px!important;background:#efc4ee!important;color:#542052!important;text-decoration:none!important;font-size:.72rem!important;line-height:1!important;font-weight:800!important;white-space:nowrap!important;box-shadow:none!important;border:0!important;}\n          .scholar-review-doi-chip:hover{background:#e7afe5!important;color:#431640!important;}\n          .scholar-review-link-chip{display:inline-flex!important;align-items:center!important;justify-content:center!important;padding:4px 10px!important;border-radius:999px!important;background:#cfeaf0!important;color:#075d6b!important;text-decoration:none!important;font-size:.72rem!important;line-height:1!important;font-weight:800!important;white-space:nowrap!important;box-shadow:none!important;border:0!important;}\n"
          if extra not in s:
              if marker not in s:
                  raise SystemExit('CSS marker not found')
              s = s.replace(marker, marker + "          " + extra, 1)

          old = """        var row=editor.querySelector('.scholar-geo-editor__row');if(!row)return;\n        var actionAnchor=Array.prototype.slice.call(node.querySelectorAll('a')).find(function(a){return /^(DOI|LINK)\\b/i.test(String(a.textContent||'').trim());});\n        var toolbar=actionAnchor&&actionAnchor.parentElement;if(!toolbar){toolbar=node.ownerDocument.createElement('div');toolbar.style.position='absolute';toolbar.style.top='10px';toolbar.style.right='12px';node.appendChild(toolbar);}toolbar.classList.add('scholar-geo-toolbar');toolbar.appendChild(row);editor.remove();\n"""
          new = """        var row=editor.querySelector('.scholar-geo-editor__row');if(!row)return;\n        var actionAnchor=Array.prototype.slice.call(node.querySelectorAll('a')).find(function(a){return /^(DOI|LINK)\\b/i.test(String(a.textContent||'').trim());});\n\n        // Move DOI/source link into the left badge row, immediately after the iTaukei-author badge.\n        // This frees the right side for geography controls and lets title/author text wrap up to them.\n        if(actionAnchor){\n          var actionText=String(actionAnchor.textContent||'').trim();\n          var authorBadge=Array.prototype.slice.call(node.querySelectorAll('span,div,strong,b,a')).find(function(el){\n            return String(el.textContent||'').replace(/\\s+/g,' ').trim().toLowerCase()==='itaukei author' && el.children.length===0;\n          });\n          var badgeParent=authorBadge&&authorBadge.parentElement;\n          var formerParent=actionAnchor.parentElement;\n          if(badgeParent){\n            actionAnchor.textContent=/^DOI\\b/i.test(actionText)?'DOI':'Link';\n            actionAnchor.classList.add(/^DOI\\b/i.test(actionText)?'scholar-review-doi-chip':'scholar-review-link-chip');\n            actionAnchor.removeAttribute('style');\n            if(authorBadge.nextSibling) badgeParent.insertBefore(actionAnchor,authorBadge.nextSibling);\n            else badgeParent.appendChild(actionAnchor);\n            if(formerParent&&formerParent!==badgeParent&&!formerParent.textContent.trim()&&!formerParent.children.length) formerParent.remove();\n          }\n        }\n\n        // Geography controls always get their own top-right toolbar.\n        var toolbar=node.ownerDocument.createElement('div');\n        toolbar.className='scholar-geo-toolbar';\n        node.appendChild(toolbar);\n        toolbar.appendChild(row);\n        editor.remove();\n"""
          if old not in s:
              raise SystemExit('JS integration block not found')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Remove one-time workflow and commit
        run: |
          git config user.name 'Ron Vave'
          git config user.email 'ronvave2015@gmail.com'
          git rm .github/workflows/inline-doi-chip-20260912.yml
          git add s.html
          git commit -m 'Move DOI chip beside authorship badge on scholar review cards'
          git push
