name: Patch scholar geography dropdown width

on:
  push:
    paths:
      - '.github/workflows/fix-scholar-dropdown-width.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch s.html dropdown geometry
        shell: python
        run: |
          from pathlib import Path
          p = Path('s.html')
          s = p.read_text(encoding='utf-8')
          old = ".scholar-geo-options{position:absolute!important;z-index:30!important;top:calc(100% + 7px)!important;left:auto!important;right:0!important;width:270px!important;max-width:270px!important;max-height:210px!important;overflow-y:auto!important;overflow-x:hidden!important;box-sizing:border-box!important;margin:0!important;padding:8px!important;background:#fff!important;border:1px solid #cbd5d8!important;border-radius:10px!important;box-shadow:0 8px 22px rgba(0,0,0,.12)!important}\n          .scholar-geo-option{display:flex;gap:8px;align-items:flex-start;padding:6px 7px;border-radius:7px;font-size:.8rem;color:#374151;cursor:pointer}\n          .scholar-geo-option:hover{background:#eaf7f9}.scholar-geo-option input{margin-top:2px;accent-color:#0e7490}"
          new = ".scholar-geo-options{position:absolute!important;z-index:30!important;top:calc(100% + 7px)!important;left:auto!important;right:0!important;width:360px!important;max-width:min(360px,calc(100vw - 56px))!important;max-height:210px!important;overflow-y:auto!important;overflow-x:hidden!important;box-sizing:border-box!important;margin:0!important;padding:8px!important;background:#fff!important;border:1px solid #cbd5d8!important;border-radius:10px!important;box-shadow:0 8px 22px rgba(0,0,0,.12)!important;text-align:left!important}\n          .scholar-geo-option{display:flex;gap:8px;align-items:flex-start;justify-content:flex-start;text-align:left;padding:6px 7px;border-radius:7px;font-size:.8rem;color:#374151;cursor:pointer;width:100%;box-sizing:border-box}\n          .scholar-geo-option span{display:block;flex:1 1 auto;min-width:0;text-align:left;white-space:normal;overflow:visible;text-overflow:clip}\n          .scholar-geo-option:hover{background:#eaf7f9}.scholar-geo-option input{margin-top:2px;accent-color:#0e7490;flex:0 0 auto}"
          if old not in s:
              raise SystemExit('Target CSS block not found; refusing unsafe patch')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add s.html
          git commit -m "Widen and left-align scholar geography dropdown lists"
          git push
