name: Patch scholar profile summary text
on:
  push:
    paths:
      - '.github/workflows/patch-scholar-profile-summary-text.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch s.html
        env:
          HELPER_B64: ''
        run: |
          python -c "import base64,os; from pathlib import Path; p=Path('s.html'); s=p.read_text(); old='        styleSummaryMetrics(d, main, card);\\n        prepareScholarPublicationFilter(w, state, scholarKey);'; new='        reviseSummaryPanelText(d, main, card);\\n        styleSummaryMetrics(d, main, card);\\n        prepareScholarPublicationFilter(w, state, scholarKey);'; assert old in s; s=s.replace(old,new,1); anchor='      function styleSummaryMetrics(d, main, card) {'; helper=base64.b64decode(os.environ['HELPER_B64']).decode(); assert anchor in s; s=s.replace(anchor,helper+anchor,1); css='          .scholar-direct-intro p{line-height:1.55}\\n'; add=css+'          .scholar-direct-main .scholar-summary-description{color:#111!important;font-size:1rem!important;line-height:1.45!important;font-weight:400!important;font-style:normal!important;}\\n'; assert css in s; s=s.replace(css,add,1); p.write_text(s)"
      - name: Commit patch
        run: |
          git config user.name 'Vave Lab automation'
          git config user.email 'actions@users.noreply.github.com'
          git add s.html
          git diff --cached --quiet && exit 1 || true
          git commit -m 'Refine scholar profile summary labels and descriptions'
          git push
