name: Align scholar publication header controls

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch scholar publication layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('s.html')
          s = p.read_text(encoding='utf-8')
          old = ".scholar-pubs-review__list>.db-item{margin:0!important;width:auto!important;max-width:none!important;position:relative!important;overflow:hidden!important}"
          new = ".scholar-pubs-review__list>.db-item{margin:0!important;width:auto!important;max-width:none!important;position:relative!important;overflow:hidden!important;box-sizing:border-box!important;padding-right:430px!important}"
          if old not in s:
              raise SystemExit('desktop item rule not found')
          s = s.replace(old, new, 1)
          old = ".scholar-geo-toolbar{display:flex!important;align-items:center!important;justify-content:flex-end!important;gap:7px!important;flex-wrap:wrap!important;position:relative!important;overflow:visible!important}"
          new = ".scholar-geo-toolbar{display:flex!important;align-items:center!important;justify-content:flex-end!important;gap:7px!important;flex-wrap:nowrap!important;position:absolute!important;top:10px!important;right:12px!important;max-width:410px!important;overflow:visible!important;z-index:20!important}"
          if old not in s:
              raise SystemExit('toolbar rule not found')
          s = s.replace(old, new, 1)
          marker = "            .scholar-direct-main .db-kpi--solid .db-kpi__label{font-size:16px!important}\n"
          addition = marker + "            .scholar-pubs-review__list>.db-item{padding-right:14px!important;padding-top:58px!important}\n            .scholar-geo-toolbar{left:12px!important;right:12px!important;max-width:none!important;justify-content:flex-start!important;flex-wrap:wrap!important}\n"
          if marker not in s:
              raise SystemExit('mobile marker not found')
          s = s.replace(marker, addition, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'Ron Vave'
          git config user.email 'ronvave2015@gmail.com'
          git add s.html
          if git diff --cached --quiet; then
            echo 'No change'
            exit 0
          fi
          git commit -m 'Align scholar publication controls with publication badges'
          git push
