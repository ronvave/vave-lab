name: Patch scholar share access through demo gate
on:
  push:
    paths:
      - '.github/workflows/patch-scholar-share-bypass-demo-gate-20260913.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch scholar direct-share capability
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # 1) Pass the already-validated scholar token into the same-origin iframe.
          p = Path('s.html')
          s = p.read_text(encoding='utf-8')
          old = "frame.src = 'itaukei-research-database-master.html?p=' + encodeURIComponent(id) + '&share=1';"
          new = "frame.src = 'itaukei-research-database-master.html?p=' + encodeURIComponent(id) + '&share=1&k=' + encodeURIComponent(token);"
          if old not in s:
              raise SystemExit('s.html iframe target not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          # 2) Teach the demo gate to accept ONLY a valid scholar-specific share capability.
          p = Path('js/demo-gate.js')
          s = p.read_text(encoding='utf-8')
          boot_marker = "  // ── Boot ─────────────────────────────────────────────────────────────\n"
          if boot_marker not in s:
              raise SystemExit('demo-gate boot marker not found')

          helper = r'''  // ── Direct scholar-share capability ──────────────────────────────────
  // A secure s.html URL resolves its opaque 40-hex token against the public
  // sharded share index, then embeds this dashboard with ?p=<ScholarID>&share=1&k=<token>.
  // Re-verify that token here before unlocking encrypted data. This makes a
  // scholar profile work in a fresh/incognito browser without granting access
  // to the rest of the pre-launch dashboard. Changing ?p= to another scholar
  // fails because the token maps to exactly one Scholar ID.
  async function verifyDirectScholarShare() {
    var params = new URLSearchParams(location.search);
    if (params.get('share') !== '1') return null;
    var id = String(params.get('p') || '').trim().toUpperCase();
    var token = String(params.get('k') || '').trim().toLowerCase();
    if (!/^ITK-S\d+$/.test(id) || !/^[a-f0-9]{40}$/.test(token)) return null;
    try {
      var digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(token));
      var hash = Array.from(new Uint8Array(digest))
        .map(function (b) { return b.toString(16).padStart(2, '0'); })
        .join('')
        .slice(0, 32);
      var shard = hash.charAt(0);
      var res = await fetch(bust('data/share-index/' + shard + '.json'), {
        cache: 'no-store',
        credentials: 'same-origin'
      });
      if (!res.ok) return null;
      var data = await res.json();
      var mappedId = String(data && data.m && data.m[hash] || '').trim().toUpperCase();
      if (mappedId !== id) return null;
      return { id: id, hash: hash };
    } catch (e) {
      return null;
    }
  }

'''
          if 'async function verifyDirectScholarShare()' not in s:
              s = s.replace(boot_marker, helper + boot_marker, 1)

          needle = "    // Dev mode wins over everything.\n"
          branch = r'''    // A validated scholar-share URL is a separate, tightly-scoped mode.
    // It bypasses the demo shell only after the opaque share token is proven
    // to belong to the requested Scholar ID. The dashboard's existing share=1
    // rendering then exposes only that direct scholar profile.
    var directShare = await verifyDirectScholarShare();
    if (directShare) {
      mode = 'share';
      cachedPasscode = BAKED_PASSCODE;
      onReady();
      return;
    }

'''
          if needle not in s:
              raise SystemExit('demo-gate dev-mode marker not found')
          if "mode = 'share';" not in s:
              s = s.replace(needle, branch + needle, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add s.html js/demo-gate.js
          git commit -m "Allow secure scholar share links in fresh browsers"
          git push
