name: Fix scholar summary rendering
'on':
  push:
    paths:
      - '.github/workflows/fix-scholar-summary-render.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch s.html
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'Vave Lab automation'
          git config user.email 'actions@users.noreply.github.com'
          git add s.html
          git diff --cached --quiet && exit 1
          git commit -m 'Fix scholar summary text rendering'
          git push
