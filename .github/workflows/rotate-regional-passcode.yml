name: Rotate regional dashboard passcode

# Manual only. Re-encrypts data/regional-scholars.json.enc with the
# REGIONAL_PASSCODE repository secret, commits the new ciphertext to main,
# then starts the validated Pages deploy. The passcode never appears in logs.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: rotate-regional-passcode
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install --quiet cryptography
      - name: Re-encrypt regional bundle
        id: rotate
        env:
          REGIONAL_PASSCODE: ${{ secrets.REGIONAL_PASSCODE }}
          REGIONAL_PASSCODE_CURRENT: ${{ secrets.REGIONAL_PASSCODE_CURRENT }}
        run: |
          out=$(python3 scripts/rotate_regional_passcode.py)
          echo "$out"
          echo "result=$out" >> "$GITHUB_OUTPUT"
      - name: Commit and deploy
        if: steps.rotate.outputs.result == 'rotated'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/regional-scholars.json.enc
          git commit -m "Regional dashboard: rotate passcode"
          git push origin HEAD:main
          gh workflow run deploy-pages-validated.yml --ref main
