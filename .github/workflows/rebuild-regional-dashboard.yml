name: Rebuild regional dashboard

# Every 2 hours (30 min after the country refreshes) and on demand. Re-reads all 11 country Master files (read-only scopes,
# service account with Viewer access), rebuilds the regional bundle in the
# runner (Vanuatu dashboard service account, Viewer on all 11), encrypts it with REGIONAL_PASSCODE, adds photos/links from the
# country bundles, and compares it with the live data/regional-scholars.json.enc.
# Commits ONLY data/regional-scholars.json.enc, and only when the check result
# is "changed" (data changed; Master modified times alone do not count).
# "blocked" (a Master not read, a missing section, or a >10% drop) keeps the
# live bundle. Plaintext stays in the runner and is deleted; logs and the run
# summary show counts only. Manual runs can choose check only.
on:
  schedule:
    - cron: "30 */2 * * *"   # every 2 hours, 30 min after the hour (UTC)
  workflow_dispatch:
    inputs:
      check_only:
        description: 'Check only (never commit)'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: rotate-regional-passcode
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet cryptography google-auth google-api-python-client
      - name: Keep a copy of the live bundle
        run: cp data/regional-scholars.json.enc "$RUNNER_TEMP/live.enc"
      - name: Decrypt university locations for the study map
        env:
          VAVELAB_PASSCODE: ${{ secrets.VAVELAB_PASSCODE }}
          VAVELAB_TONGAN_PASSCODE: ${{ secrets.VAVELAB_TONGAN_PASSCODE }}
        run: |
          set -euo pipefail
          python3 scripts/decrypt_data.py world-universities.json itaukei-master-worldpoints.json >/dev/null
          python3 scripts/tongan_decrypt_data.py tongan-world-universities.json tongan-master-worldpoints.json >/dev/null
          mkdir -p /tmp/uni
          cp data/itaukei-master-worldpoints.json data/tongan-master-worldpoints.json /tmp/uni/
      - name: Read Masters and build
        env:
          REGIONAL_GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.VANUATU_GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python3 scripts/build_regional_scholars.py --pull --dump-dir "$RUNNER_TEMP/dumps" --out data/regional-scholars.json
      - name: Encrypt
        env:
          REGIONAL_PASSCODE: ${{ secrets.REGIONAL_PASSCODE }}
        run: |
          python3 scripts/encrypt_regional.py
          rm -f data/regional-scholars.json
      - name: Add photos and links from the country dashboards
        env:
          REGIONAL_PASSCODE: ${{ secrets.REGIONAL_PASSCODE }}
          VAVELAB_PASSCODE: ${{ secrets.VAVELAB_PASSCODE }}
          VAVELAB_TONGAN_PASSCODE: ${{ secrets.VAVELAB_TONGAN_PASSCODE }}
          VAVELAB_SOLOMON_PASSCODE: ${{ secrets.VAVELAB_SOLOMON_PASSCODE }}
          VAVELAB_VANUATU_PASSCODE: ${{ secrets.VAVELAB_VANUATU_PASSCODE }}
        run: python3 scripts/regional_card_extras.py
      - name: Compare with the live bundle (counts only)
        id: cmp
        env:
          REGIONAL_PASSCODE: ${{ secrets.REGIONAL_PASSCODE }}
        run: python3 scripts/regional_rebuild_check.py "$RUNNER_TEMP/live.enc" data/regional-scholars.json.enc
      - name: Remove plaintext before committing
        run: |
          rm -rf "$RUNNER_TEMP/dumps" /tmp/uni data/regional-scholars.json
          rm -f data/world-universities.json data/itaukei-master-worldpoints.json \
                data/tongan-world-universities.json data/tongan-master-worldpoints.json
      - name: Commit and deploy
        if: steps.cmp.outputs.result == 'changed' && inputs.check_only != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/regional-scholars.json.enc
          git commit -m "Regional dashboard: automatic rebuild from the Master files"
          for i in 1 2 3 4; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
          gh workflow run deploy-pages-validated.yml --ref main
      - name: Remove plaintext
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/dumps" /tmp/uni data/regional-scholars.json
          rm -f data/world-universities.json data/itaukei-master-worldpoints.json \
                data/tongan-world-universities.json data/tongan-master-worldpoints.json
      - name: Flag a blocked rebuild
        if: steps.cmp.outputs.result == 'blocked'
        run: |
          echo "::error::Rebuild blocked by the safety checks; the live bundle was kept. See the run summary."
          exit 1
