name: TEMP - Tongan service-account access diagnostic

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install google-api-python-client google-auth
      - name: Try reading the Tongan Master Sheet
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          from google.oauth2 import service_account
          from googleapiclient.discovery import build

          key_json = os.environ["GOOGLE_SERVICE_ACCOUNT_JSON"]
          info = json.loads(key_json)
          print("service account email:", info.get("client_email"))
          creds = service_account.Credentials.from_service_account_info(
              info, scopes=["https://www.googleapis.com/auth/spreadsheets.readonly"]
          )
          svc = build("sheets", "v4", credentials=creds)
          SPREADSHEET_ID = "1lh6wOFcg2GiFe2YylgxM5cvLOdumdbCrHDLQk87rjRI"
          try:
              resp = svc.spreadsheets().values().get(
                  spreadsheetId=SPREADSHEET_ID, range="Scholars!A1:H6"
              ).execute()
              print("SUCCESS reading Tongan Scholars sheet:")
              for row in resp.get("values", []):
                  print(" ", row)
          except Exception as e:
              print("FAILURE reading Tongan sheet:", repr(e))
              sys.exit(1)
          PY
