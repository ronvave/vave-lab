name: Temporary cache bust

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bust-cache:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recompute static asset hashes
        run: python3 scripts/bust_cache.py
      - name: Commit cache-bust updates
        run: |
          if git diff --quiet; then
            echo "No cache-bust changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          git commit -m "Auto-update cache-bust hashes"
          git push
