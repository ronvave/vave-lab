name: Refresh Tongan Master File snapshot

# Sister workflow to refresh-master-file.yml (iTaukei). Runs every 2 hours
# (offset 5 minutes after the iTaukei run to reduce commit-race odds on
# main) and on manual dispatch — including the Tongan Admin Panel's
# "Refresh from Sheet" / "Force refresh" buttons, which call the GitHub
# Actions dispatch API for this workflow.
#
# Reads the Tongan Scholars Master Sheet via a service account,
# transforms + sanitizes, encrypts, and commits. NEVER touches
# data/itaukei-* files, itaukei_* scripts, or refresh-master-file.yml.
#
# Requires GitHub Secrets:
#   GOOGLE_SERVICE_ACCOUNT_JSON  — raw JSON of a Google Cloud service account
#                                   key (shared with the iTaukei workflow);
#                                   must be granted Editor on the Tongan
#                                   Master Sheet separately (see docs)
#   VAVELAB_TONGAN_PASSCODE      — passcode used to derive AES-GCM key for
#                                   Tongan data files (distinct from
#                                   VAVELAB_PASSCODE)
#
# Deferred parity item: this workflow intentionally omits a
# master_file_reconcile.py-equivalent QA step. The iTaukei reconcile
# script is hard-coded to specific row/column positions on the iTaukei
# Master-file Dashboard tab; the Tongan Dashboard tab's layout has not
# been confirmed to match, so a strict reconcile step would be guessing.
# This can be added later once the Tongan Dashboard sheet's QA layout is
# confirmed.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-tongan-master-file.yml"
      - "scripts/tongan_master_file_config.py"
      - "scripts/tongan_master_file_transformer.py"
      - "scripts/tongan_encrypt_data.py"
      - "scripts/tongan_decrypt_data.py"
      - "js/tongan-database-adapter.js"
      - "js/tongan-database-master.js"
  schedule:
    - cron: "5 */2 * * *"   # every 2 hours, 5 min after the hour (UTC)
  workflow_dispatch:
    inputs:
      force_commit:
        description: "Commit even when totals drift <2% (heartbeat)"
        required: false
        default: "false"
      dry_run:
        description: "Run transformer but don't commit"
        required: false
        default: "false"

concurrency:
  group: refresh-tongan-master-file
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            google-api-python-client \
            google-auth \
            cryptography

      - name: Decrypt current snapshot (bootstrap for diff)
        env:
          VAVELAB_TONGAN_PASSCODE: ${{ secrets.VAVELAB_TONGAN_PASSCODE }}
        run: |
          set -euo pipefail
          if [ -f data/tongan-last-master-sync.json.enc ]; then
            python3 scripts/tongan_decrypt_data.py --all || \
              echo "Bootstrap decrypt failed (first run?); continuing"
          else
            echo "No prior Tongan Master-file snapshot; first run"
          fi

      - name: Stash previous plaintext for diff
        run: |
          set -euo pipefail
          mkdir -p /tmp/prev
          for f in \
            data/tongan-last-master-sync.json \
            data/tongan-master-aggregates.json \
            data/tongan-master-scholars.json \
            data/tongan-master-publications.json \
            data/tongan-master-authorship.json \
            data/tongan-master-researcher-authorship.json \
            data/tongan-master-grad-degrees.json \
            data/tongan-master-mobility.json \
            data/tongan-master-geography.json \
            data/tongan-master-geography-coordinates.json \
            data/tongan-master-worldpoints.json \
            data/tongan-body-composition-master.json; do
            [ -f "$f" ] && cp "$f" "/tmp/prev/$(basename "$f")" || true
          done

      - name: Autofill missing university coordinates
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          # Coordinate enrichment is helpful for Panel B2, but a temporary
          # Sheets write-permission failure must not block the read-only B4
          # Research Geography snapshot refresh.
          python3 scripts/tongan_autofill_university_coords.py || \
            echo "University-coordinate autofill unavailable; continuing with Master snapshot refresh"

      - name: Fetch, sanitize, and transform Tongan Master file
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          python3 scripts/tongan_master_file_transformer.py \
            --mode=production \
            --out-dir=data

      - name: Diff vs previous snapshot
        id: diff
        run: |
          set -euo pipefail
          if [ -f /tmp/prev/tongan-master-aggregates.json ]; then
            python3 scripts/master_file_diff.py \
              --prev=/tmp/prev/tongan-master-aggregates.json \
              --curr=data/tongan-master-aggregates.json \
              --output=/tmp/tongan_diff.txt || true
            echo "delta_pct=$(cat /tmp/diff_pct.txt 2>/dev/null || echo '0')" >> "$GITHUB_OUTPUT"
          else
            echo "delta_pct=100" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect plaintext content changes
        id: changed
        run: |
          set -euo pipefail
          # Only re-encrypt files whose *plaintext* actually changed.
          # scripts/tongan_encrypt_data.py generates a fresh AES salt per
          # run, so a naive re-encrypt would rewrite every .enc even when
          # the underlying Master-file data is byte-identical. See
          # scripts/plaintext_changed.py (shared, generic script).
          #
          # tongan-last-master-sync.json embeds startedAt/finishedAt
          # timestamps, so we exclude it from the plaintext-diff and
          # rewrite it ONLY when at least one content file changed.
          CONTENT_FILES=(
            tongan-master-scholars.json
            tongan-master-publications.json
            tongan-master-authorship.json
            tongan-master-researcher-authorship.json
            tongan-master-grad-degrees.json
            tongan-master-mobility.json
            tongan-master-geography.json
            tongan-master-geography-coordinates.json
            tongan-master-aggregates.json
            tongan-master-worldpoints.json
            tongan-body-composition-master.json
          )
          python3 scripts/plaintext_changed.py \
            --prev-dir=/tmp/prev \
            --curr-dir=data \
            "${CONTENT_FILES[@]}" \
            > /tmp/tongan_changed.txt
          CHANGED_COUNT=$(wc -l < /tmp/tongan_changed.txt | tr -d ' ')
          echo "content_changed_count=${CHANGED_COUNT}" >> "$GITHUB_OUTPUT"
          if [ "${CHANGED_COUNT}" = "0" ]; then
            echo "No plaintext content changes. Skipping encrypt + commit."
          else
            echo "Plaintext-changed files:"
            cat /tmp/tongan_changed.txt
          fi

      - name: Encrypt data files
        if: steps.changed.outputs.content_changed_count != '0'
        env:
          VAVELAB_TONGAN_PASSCODE: ${{ secrets.VAVELAB_TONGAN_PASSCODE }}
        run: |
          set -euo pipefail
          # Encrypt ONLY the plaintext-changed content files, plus
          # tongan-last-master-sync.json (safe to refresh timestamps when
          # at least one content file changed).
          TARGETS=()
          while IFS= read -r name; do
            [ -n "$name" ] && TARGETS+=("$name")
          done < /tmp/tongan_changed.txt
          TARGETS+=(tongan-last-master-sync.json)
          echo "Encrypting: ${TARGETS[*]}"
          python3 scripts/tongan_encrypt_data.py "${TARGETS[@]}"

      - name: Commit
        if: ${{ github.event.inputs.dry_run != 'true' && steps.changed.outputs.content_changed_count != '0' }}
        env:
          FORCE_COMMIT: ${{ github.event.inputs.force_commit }}
          DELTA_PCT: ${{ steps.diff.outputs.delta_pct }}
        run: |
          set -euo pipefail
          git config user.name "vavelab-bot"
          git config user.email "bot@vavelab.example"
          git add \
            data/tongan-master-*.json.enc \
            data/tongan-body-composition-master.json.enc \
            data/tongan-last-master-sync.json.enc
          if git diff --cached --quiet; then
            echo "No changes to commit (unexpected — plaintext_changed said yes)"
            exit 0
          fi
          MSG="chore: Tongan Master-file heartbeat"
          if [ "${DELTA_PCT}" != "0" ] && [ "$(python3 -c "print(float('$DELTA_PCT') >= 2.0)")" = "True" ]; then
            MSG="Auto-refresh: Tongan Master-file snapshot (delta ${DELTA_PCT}%)"
          fi
          if [ "${FORCE_COMMIT}" = "true" ]; then
            MSG="${MSG} [manual]"
          fi
          git commit -m "$MSG"
          # Rebase-retry push (pattern from the iTaukei / Zotero workflows)
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin main && exit 0
            echo "Push attempt $attempt failed; retrying..."
            sleep $((attempt * 5))
          done
          echo "Failed to push after 3 attempts"
          exit 1
