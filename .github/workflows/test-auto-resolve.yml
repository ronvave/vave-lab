name: test-auto-resolve

# End-to-end smoke test for data/auto_resolve.py. Injects a fake
# country + university into a doctored copy of the snapshot and
# confirms the refresh script's auto-resolver heals both gaps.
#
# See scripts/test_auto_resolve.py for the test body and
# docs/DATA-COVERAGE-GAPS.md for the auto-resolve policy.

on:
  push:
    paths:
      - "data/auto_resolve.py"
      - "data/refresh-graduate-studies.py"
      - "scripts/test_auto_resolve.py"
      - ".github/workflows/test-auto-resolve.yml"
  schedule:
    # Weekly heartbeat — Sundays 09:00 UTC. Catches upstream API
    # outages (World Bank, Wikipedia, Nominatim) before they break
    # the next refresh.
    - cron: "0 9 * * 0"
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install "cryptography>=42"

      - name: Guard passcode secret
        env:
          VAVELAB_PASSCODE: ${{ secrets.VAVELAB_PASSCODE }}
        run: |
          if [ -z "$VAVELAB_PASSCODE" ]; then
            echo "::error::VAVELAB_PASSCODE secret is not set on this repo."
            exit 1
          fi

      - name: Decrypt snapshot
        env:
          VAVELAB_PASSCODE: ${{ secrets.VAVELAB_PASSCODE }}
        run: python3 scripts/decrypt_data.py itaukei-zotero-snapshot.json

      - name: Run auto-resolver E2E test
        run: python3 scripts/test_auto_resolve.py
