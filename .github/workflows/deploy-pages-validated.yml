name: Deploy validated site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Commits created with GITHUB_TOKEN do not emit another `push` workflow
  # event. The Master refresh workflow commits regenerated encrypted snapshots
  # with that token, so listen for its successful completion explicitly and
  # deploy the newly updated main branch.
  workflow_run:
    workflows:
      - Refresh iTaukei Master File snapshot
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Reject truncated or structurally damaged dashboards
        env:
          PUSH_BASE: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: python3 scripts/validate_dashboard_integrity.py --revision HEAD --base "$PUSH_BASE"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Check out validated source
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
