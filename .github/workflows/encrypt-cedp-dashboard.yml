name: Encrypt China Education Diplomacy dashboard data

# Manual only. Re-encrypts data/cedp-patch.enc (one-time key in the
# CEDP_PATCH_KEY secret) under the REGIONAL_PASSCODE secret as
# data/china-education-diplomacy.json.enc, deletes the patch, commits to main
# and starts the validated Pages deploy. No passcode or plaintext is logged.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: rotate-regional-passcode
  cancel-in-progress: false

jobs:
  encrypt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install --quiet cryptography
      - name: Re-encrypt under the Regional passcode
        id: enc
        env:
          REGIONAL_PASSCODE: ${{ secrets.REGIONAL_PASSCODE }}
          CEDP_PATCH_KEY: ${{ secrets.CEDP_PATCH_KEY }}
        run: |
          out=$(python3 scripts/encrypt_cedp_patch.py)
          echo "$out"
          echo "result=${out%% *}" >> "$GITHUB_OUTPUT"
      - name: Commit and deploy
        if: steps.enc.outputs.result == 'encrypted'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/china-education-diplomacy.json.enc
          git rm -q --cached --ignore-unmatch data/cedp-patch.enc
          git commit -m "China Education Diplomacy dashboard: encrypt data under the Regional passcode"
          git push origin HEAD:main
          gh workflow run deploy-pages-validated.yml --ref main
