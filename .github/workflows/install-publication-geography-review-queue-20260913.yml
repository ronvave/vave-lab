name: Install publication geography review queue

on:
  push:
    paths:
      - '.github/workflows/install-publication-geography-review-queue-20260913.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch scholar submission, admin loader, and Apps Script source
        shell: python
        run: |
          from pathlib import Path
          import re

          # 1) Admin HTML: load the dedicated queue UI after admin-master.js.
          p=Path('admin-master.html'); s=p.read_text(encoding='utf-8')
          marker='<script src="js/admin-master.js?v=35ae0614" defer></script>'
          if 'publication-geography-admin.js' not in s:
              if marker not in s: raise SystemExit('admin-master.js marker not found')
              s=s.replace(marker, marker+'\n<script src="js/publication-geography-admin.js?v=20260913a" defer></script>',1)
          p.write_text(s,encoding='utf-8')

          # 2) Direct scholar page: retain current provinces in payload and submit to our Apps Script queue.
          p=Path('s.html'); s=p.read_text(encoding='utf-8')
          old="dirty.set(item.key,{item_key:item.key,title:item.title||'',year:item.year||'',provinces:provinces,pacific_countries:countries,other_countries:other});"
          new="dirty.set(item.key,{item_key:item.key,title:item.title||'',year:item.year||'',existing_provinces:Array.from(existing),provinces:provinces,pacific_countries:countries,other_countries:other});"
          if old in s: s=s.replace(old,new,1)
          elif 'existing_provinces:Array.from(existing)' not in s: raise SystemExit('s.html dirty payload marker not found')

          pat=re.compile(r"var payload=Array\.from\(dirty\.values\(\)\);var fd=new FormData\(\);.*?finally\{btn\.disabled=false;\}",re.S)
          repl="""var payload=Array.from(dirty.values());try{var cfgRes=await fetch('data/public-submit-endpoint.json?ts='+Date.now(),{cache:'no-store'});if(!cfgRes.ok)throw new Error('Submission service is not configured yet');var cfg=await cfgRes.json();var submitEndpoint=String(cfg&&cfg.endpoint||'').trim();if(!/^https:\\/\\/script\\.google\\.com\\//.test(submitEndpoint))throw new Error('Submission service is not configured yet');var r=await fetch(submitEndpoint,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8','Accept':'application/json'},body:JSON.stringify({action:'submitPublicationGeography',shareToken:token,scholarId:scholarId,scholarName:scholarName,profileUrl:location.href,submitterName:name,submitterEmail:email,submitterRelationship:rel,changes:payload})});var j=await r.json();if(!r.ok||!j||j.status!=='ok')throw new Error((j&&(j.error||j.reason||j.status))||'Submission failed');dirty.clear();updateDirtyCounter(d,0);stateEl.textContent='Submitted to V2 Admin for review. Thank you.';stateEl.classList.add('is-ok');}catch(e){console.error(e);stateEl.textContent='Could not submit right now. Please try again.';stateEl.classList.add('is-error');}finally{btn.disabled=false;}"""
          s2,n=pat.subn(repl,s,count=1)
          if n!=1 and 'Submitted to V2 Admin for review' not in s: raise SystemExit('s.html FormSubmit block not found')
          s=s2 if n else s
          p.write_text(s,encoding='utf-8')

          # 3) Apps Script source: add authenticated admin read/resolve actions and one token-authenticated public submit action.
          p=Path('apps-script/master-writeback.gs'); s=p.read_text(encoding='utf-8')
          get_marker="""    if (action === 'readChangeLog') {\n      return handleReadChangeLog_(params);\n    }"""
          get_add=get_marker+"""\n    if (action === 'readPublicationGeographySubmissions') {\n      return handleReadPublicationGeographySubmissions_(params);\n    }"""
          if 'readPublicationGeographySubmissions' not in s:
              if get_marker not in s: raise SystemExit('Apps Script doGet marker not found')
              s=s.replace(get_marker,get_add,1)

          post_old="""  try {\n    if (!checkAuth_(body)) return jsonOut_({ status: 'unauthorized' }, 401);\n    if (!writeEnabled_()) return jsonOut_({ status: 'disabled', reason: 'WRITE_ENABLED=false' }, 423);\n    var action = body.action || 'write';\n    if (action === 'write') return handleWrite_(body);\n    if (action === 'ping')  return jsonOut_({ status: 'ok', pong: true, writeEnabled: true });"""
          post_new="""  try {\n    var action = body.action || 'write';\n    // Public scholar geography submission is authenticated by the scholar's opaque 40-hex share token, not the Admin shared secret.\n    if (action === 'submitPublicationGeography') return handlePublicPublicationGeographySubmission_(body);\n    if (!checkAuth_(body)) return jsonOut_({ status: 'unauthorized' }, 401);\n    if (!writeEnabled_()) return jsonOut_({ status: 'disabled', reason: 'WRITE_ENABLED=false' }, 423);\n    if (action === 'write') return handleWrite_(body);\n    if (action === 'resolvePublicationGeographySubmission') return handleResolvePublicationGeographySubmission_(body);\n    if (action === 'ping')  return jsonOut_({ status: 'ok', pong: true, writeEnabled: true });"""
          if 'handlePublicPublicationGeographySubmission_(body)' not in s:
              if post_old not in s: raise SystemExit('Apps Script doPost marker not found')
              s=s.replace(post_old,post_new,1)

          if 'function handlePublicPublicationGeographySubmission_' not in s:
              s += r'''\n\n// ---------------- PUBLICATION GEOGRAPHY REVIEW QUEUE ----------------\nvar GEO_SUBMISSION_SHEET = 'Publication Geography Submissions';\nvar GEO_SUBMISSION_HEADERS = ['Submission ID','Submitted At','Status','Scholar ID','Scholar Name','Submitter Name','Submitter Email','Relationship','Profile URL','Publication Key','Publication Title','Year','Existing Fiji Provinces','Proposed Fiji Provinces','Proposed Pacific Countries','Proposed Other Countries','Review Notes','Reviewed By','Reviewed At','Resolution'];\n\nfunction geoSs_(){ return SpreadsheetApp.openById(SPREADSHEET_ID_HINT); }\nfunction cleanGeoList_(v){ if (!Array.isArray(v)) return []; var out=[]; v.forEach(function(x){x=String(x||'').trim(); if(x && out.indexOf(x)<0) out.push(x);}); return out.slice(0,50); }\nfunction validScholarShareToken_(ss,sid,token){\n  if(!/^ITK-S\\d+$/i.test(String(sid||'')) || !/^[a-f0-9]{40}$/i.test(String(token||''))) return false;\n  var sh=ss.getSheetByName('Scholars'); if(!sh) return false; var lastCol=sh.getLastColumn(); var headers=sh.getRange(4,1,1,lastCol).getDisplayValues()[0];\n  var idCol=headers.indexOf('Scholar ID')+1, tokCol=headers.indexOf('Scholar Share Token')+1; if(!idCol||!tokCol) return false;\n  var last=sh.getLastRow(); if(last<5) return false; var ids=sh.getRange(5,idCol,last-4,1).getDisplayValues();\n  for(var i=0;i<ids.length;i++){ if(String(ids[i][0]).toUpperCase()===String(sid).toUpperCase()){ return String(sh.getRange(i+5,tokCol).getDisplayValue()).toLowerCase()===String(token).toLowerCase(); }}\n  return false;\n}\nfunction handlePublicPublicationGeographySubmission_(body){\n  var ss=geoSs_(), sid=String(body.scholarId||'').toUpperCase(), token=String(body.shareToken||'').trim();\n  if(!validScholarShareToken_(ss,sid,token)) return jsonOut_({status:'unauthorized',reason:'invalid-scholar-share-token'},401);\n  var name=String(body.submitterName||'').trim(), email=String(body.submitterEmail||'').trim(), rel=String(body.submitterRelationship||'').trim();\n  if(!name || !/^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$/.test(email)) return jsonOut_({status:'bad_request',reason:'valid-name-and-email-required'},400);\n  var changes=Array.isArray(body.changes)?body.changes:[]; if(!changes.length || changes.length>100) return jsonOut_({status:'bad_request',reason:'changes-required-or-too-many'},400);\n  var sh=ss.getSheetByName(GEO_SUBMISSION_SHEET); if(!sh) return jsonOut_({status:'error',reason:'submission-sheet-missing'},500);\n  var now=new Date(), ts=Utilities.formatDate(now,TIMEZONE,'yyyy-MM-dd HH:mm:ss'), scholarName=String(body.scholarName||'').slice(0,240), profileUrl=String(body.profileUrl||'').slice(0,700);\n  var rows=[]; changes.forEach(function(c){ var key=String(c.item_key||'').trim().slice(0,300); if(!key)return; var sub='PGS-'+Utilities.formatDate(now,TIMEZONE,'yyyyMMddHHmmss')+'-'+Utilities.getUuid().slice(0,8); rows.push([sub,ts,'Pending',sid,scholarName,name.slice(0,160),email.slice(0,240),rel.slice(0,100),profileUrl,key,String(c.title||'').slice(0,700),String(c.year||'').slice(0,20),cleanGeoList_(c.existing_provinces).join('; '),cleanGeoList_(c.provinces).join('; '),cleanGeoList_(c.pacific_countries).join('; '),cleanGeoList_(c.other_countries).join('; '),'','','','']); });\n  if(!rows.length) return jsonOut_({status:'bad_request',reason:'no-valid-publications'},400);\n  var lock=LockService.getScriptLock(); lock.waitLock(LOCK_WAIT_MS); try{ sh.getRange(sh.getLastRow()+1,1,rows.length,GEO_SUBMISSION_HEADERS.length).setValues(rows); } finally {lock.releaseLock();}\n  return jsonOut_({status:'ok',queued:rows.length});\n}\nfunction handleReadPublicationGeographySubmissions_(params){\n  var ss=geoSs_(), sh=ss.getSheetByName(GEO_SUBMISSION_SHEET); if(!sh) return jsonOut_({status:'ok',rows:[]}); var last=sh.getLastRow(); if(last<5)return jsonOut_({status:'ok',rows:[]});\n  var vals=sh.getRange(5,1,last-4,GEO_SUBMISSION_HEADERS.length).getDisplayValues(), want=String(params.status||'').trim(), rows=[];\n  vals.forEach(function(r){if(!r[0])return;if(want && r[2]!==want)return;var o={};GEO_SUBMISSION_HEADERS.forEach(function(h,i){o[h]=r[i]||''});rows.push(o)}); rows.reverse(); return jsonOut_({status:'ok',rows:rows});\n}\nfunction splitSemi_(s){return String(s||'').split(';').map(function(x){return x.trim()}).filter(function(x,i,a){return x&&a.indexOf(x)===i;});}\nfunction nextGeoId_(sh){var last=sh.getLastRow(),max=0;if(last>=5){sh.getRange(5,1,last-4,1).getDisplayValues().forEach(function(r){var m=String(r[0]||'').match(/^GEO-(\\d+)$/);if(m)max=Math.max(max,Number(m[1]));});}return function(){max++;return 'GEO-'+String(max).padStart(4,'0');};}\nfunction addApprovedGeoRows_(ss,rowObj){\n  var sh=ss.getSheetByName('Research Geography'); if(!sh) throw new Error('Research Geography sheet missing'); var last=sh.getLastRow(), existing={};\n  if(last>=5){sh.getRange(5,2,last-4,5).getDisplayValues().forEach(function(r){existing[[r[0],r[3],r[4]].join('||').toLowerCase()]=true;});}\n  var nextId=nextGeoId_(sh), pub=rowObj['Publication Key'], sid=rowObj['Scholar ID'], added=0, today=Utilities.formatDate(new Date(),TIMEZONE,'yyyy-MM-dd');\n  function add(country,province,type){var k=[pub,country,province].join('||').toLowerCase();if(existing[k])return;var r=sh.getLastRow()+1;sh.getRange(r,1,1,13).setValues([[nextId(),pub,sid,type,country,province,'','','','Scholar/profile geography submission approved in Admin V2.','Submitted via '+rowObj['Profile URL'],'Verified — Admin V2 approved scholar submission',today]]);if(province)sh.getRange(r,9).setFormula('=IF($F'+r+'="","",IFNA(XLOOKUP($F'+r+',Lookups!$I$4:$I$18,Lookups!$J$4:$J$18),"Unclassified"))');existing[k]=true;added++;}\n  splitSemi_(rowObj['Proposed Fiji Provinces']).forEach(function(p){if(p==='Fiji — general/national study')add('Fiji','','National / general study');else add('Fiji',p,'Province / study location');});\n  splitSemi_(rowObj['Proposed Pacific Countries']).forEach(function(c){add(c,'','Country / study location');}); splitSemi_(rowObj['Proposed Other Countries']).forEach(function(c){add(c,'','Country / study location');}); return added;\n}\nfunction handleResolvePublicationGeographySubmission_(body){\n  var id=String(body.submissionId||'').trim(), decision=String(body.decision||'').toLowerCase(); if(!id || ['approve','reject'].indexOf(decision)<0)return jsonOut_({status:'bad_request',reason:'invalid-resolution'},400);\n  var ss=geoSs_(),sh=ss.getSheetByName(GEO_SUBMISSION_SHEET),last=sh.getLastRow(),found=0,rowObj=null; if(last<5)return jsonOut_({status:'not_found'},404); var vals=sh.getRange(5,1,last-4,GEO_SUBMISSION_HEADERS.length).getDisplayValues();\n  for(var i=0;i<vals.length;i++){if(vals[i][0]===id){found=i+5;rowObj={};GEO_SUBMISSION_HEADERS.forEach(function(h,j){rowObj[h]=vals[i][j]||''});break;}} if(!found)return jsonOut_({status:'not_found'},404); if(rowObj.Status!=='Pending')return jsonOut_({status:'bad_request',reason:'already-resolved'},409);\n  var lock=LockService.getScriptLock();lock.waitLock(LOCK_WAIT_MS);try{var added=decision==='approve'?addApprovedGeoRows_(ss,rowObj):0;var now=Utilities.formatDate(new Date(),TIMEZONE,'yyyy-MM-dd HH:mm:ss'),notes=String(body.reviewNotes||'').slice(0,1500),reviewer=String(body.reviewedBy||ACTOR_LABEL).slice(0,160);sh.getRange(found,3).setValue(decision==='approve'?'Approved':'Rejected');sh.getRange(found,17,1,4).setValues([[notes,reviewer,now,decision==='approve'?('Approved; '+added+' new Research Geography row(s) added. Existing geography preserved.'):'Rejected; no Research Geography changes made.']]);appendChangeLog_(ss,'Publication Geography Submissions',rowObj['Scholar ID'],id,'Pending',decision==='approve'?'Approved':'Rejected');return jsonOut_({status:'ok',decision:decision,added:added});}finally{lock.releaseLock();}\n}\n''' 
          p.write_text(s,encoding='utf-8')

      - name: Commit changes
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-master.html s.html apps-script/master-writeback.gs
          git commit -m "Route scholar publication geography to Admin V2 review queue"
          git push
