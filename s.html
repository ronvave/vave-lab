<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>iTaukei Scholar Profile</title>
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <style>
    html, body { margin:0; width:100%; height:100%; background:#f8f7f2; overflow:hidden; }
    iframe { display:block; width:100%; height:100%; border:0; background:#f8f7f2; }
    .msg { font-family:Arial,Helvetica,sans-serif; padding:32px; color:#243238; }
  </style>
</head>
<body>
  <script>
    (function () {
      var id = new URLSearchParams(location.search).get('i') || '';
      if (!/^ITK-S\d+$/i.test(id)) {
        var msg = document.createElement('div');
        msg.className = 'msg';
        msg.textContent = 'This scholar link is incomplete or invalid.';
        document.body.appendChild(msg);
        return;
      }
      id = id.toUpperCase();
      var frame = document.createElement('iframe');
      frame.title = 'iTaukei scholar profile';
      frame.src = 'itaukei-research-database-master.html?p=' + encodeURIComponent(id);
      frame.setAttribute('allow', 'web-share; clipboard-write');
      frame.setAttribute('referrerpolicy', 'same-origin');
      document.body.appendChild(frame);
    })();
  </script>
</body>
</html>
