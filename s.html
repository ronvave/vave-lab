<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <meta name="referrer" content="no-referrer" />
  <title>iTaukei Scholar Profile</title>
  <style>
    html, body { margin:0; width:100%; height:100%; background:#f8f7f2; overflow:hidden; }
    iframe { display:block; width:100%; height:100%; border:0; background:#f8f7f2; }
    .msg { max-width:680px; margin:80px auto; font-family:Arial,Helvetica,sans-serif; padding:32px; color:#243238; text-align:center; }
  </style>
</head>
<body>
  <script>
    (async function () {
      'use strict';
      var params = new URLSearchParams(location.search);
      var token = String(params.get('k') || '').trim();

      function fail() {
        document.body.innerHTML = '';
        var msg = document.createElement('div');
        msg.className = 'msg';
        msg.textContent = 'This scholar link is invalid or has expired.';
        document.body.appendChild(msg);
      }

      // Legacy enumerable ?i=ITK-Sxxxx links are deliberately retired.
      // Share tokens are opaque 40-character random hex values held privately
      // in the Master Sheet. Only a truncated SHA-256 digest is published.
      if (!/^[a-f0-9]{40}$/i.test(token) || params.has('i')) {
        fail();
        return;
      }

      try {
        var bytes = new TextEncoder().encode(token.toLowerCase());
        var digest = await crypto.subtle.digest('SHA-256', bytes);
        var hash = Array.from(new Uint8Array(digest))
          .map(function (b) { return b.toString(16).padStart(2, '0'); })
          .join('')
          .slice(0, 32);

        var shard = hash.charAt(0);
        var res = await fetch('data/share-index/' + shard + '.json', {
          cache: 'no-store',
          credentials: 'same-origin'
        });
        if (!res.ok) throw new Error('share-index unavailable');
        var data = await res.json();
        var id = data && data.m && data.m[hash];
        if (!/^ITK-S\d+$/i.test(String(id || ''))) {
          fail();
          return;
        }
        id = String(id).toUpperCase();

        // Capability is scoped to this tab/session. The master dashboard will
        // only honor ?p=... when the matching capability was established here.
        sessionStorage.setItem('vavelab_share_cap_sid', id);
        sessionStorage.setItem('vavelab_share_cap_hash', hash);

        var frame = document.createElement('iframe');
        frame.title = 'iTaukei scholar profile';
        frame.src = 'itaukei-research-database-master.html?p=' + encodeURIComponent(id) + '&share=1';
        frame.setAttribute('allow', 'web-share; clipboard-write');
        frame.setAttribute('referrerpolicy', 'no-referrer');
        document.body.appendChild(frame);

        frame.addEventListener('load', function () {
          enhanceDirectProfile(frame, id);
        });
      } catch (err) {
        console.error('Scholar share-link resolution failed', err);
        fail();
      }

      function enhanceDirectProfile(frame, scholarId) {
        var tries = 0;
        var timer = setInterval(function () {
          tries += 1;
          try {
            var w = frame.contentWindow;
            var d = frame.contentDocument;
            var main = d && d.querySelector('.scholar-direct-main');
            var state = w && w.__vavelabDbState;
            if (!main || !state || !state.snapshot || !state.scholarProfilesByName) {
              if (tries > 240) clearInterval(timer);
              return;
            }
            clearInterval(timer);
            injectDirectProfileEnhancements(w, d, main, state, scholarId);
          } catch (e) {
            if (tries > 240) clearInterval(timer);
          }
        }, 125);
      }

      function injectDirectProfileEnhancements(w, d, main, state, scholarId) {
        if (main.dataset.profileReviewEnhanced === '1') return;
        main.dataset.profileReviewEnhanced = '1';

        injectStyles(d);

        var profileEntry = findProfile(state, scholarId);
        var profile = profileEntry ? profileEntry.profile : {};
        var scholarKey = profileEntry ? profileEntry.key : '';
        var scholarName = getScholarName(main, profile);

        var existingIntro = main.querySelector('.scholar-direct-intro');
        var about = buildAboutBlock(d);
        if (existingIntro) existingIntro.insertAdjacentElement('beforebegin', about);
        else main.insertBefore(about, main.firstChild);

        var card = main.querySelector('.db-scholar-card');
        if (!card) return;

        prepareScholarPublicationFilter(w, state, scholarKey);
        buildPublicationReviewWhenReady(w, d, main, state, scholarId, scholarKey, scholarName, card);
      }

      function injectStyles(d) {
        if (d.getElementById('direct-profile-review-v2-style')) return;
        var style = d.createElement('style');
        style.id = 'direct-profile-review-v2-style';
        style.textContent = `
          .scholar-direct-about{
            max-width:980px;margin:0 auto 18px;padding:17px 20px;
            background:#fff;border:1px solid rgba(14,116,144,.16);border-radius:14px;
            font-family:"DM Sans",Arial,sans-serif;font-size:.95rem;line-height:1.58;color:#5f6570;
          }
          .scholar-direct-about p{margin:0}.scholar-direct-about a{color:#087d93;text-decoration:underline;text-underline-offset:2px}
          .scholar-pubs-review{max-width:1020px;margin:28px auto 12px;font-family:"DM Sans",Arial,sans-serif}
          .scholar-pubs-review__head{padding:18px 20px;background:rgba(14,116,144,.055);border:1px solid rgba(14,116,144,.20);border-radius:14px;margin-bottom:14px}
          .scholar-pubs-review__head h2{margin:0 0 6px;color:#123f47;font-family:Arial,Helvetica,sans-serif;font-size:1.2rem;font-weight:700}
          .scholar-pubs-review__head p{margin:0 0 9px;color:#4b5563;font-size:.9rem;line-height:1.55}
          .scholar-pubs-review__head p:last-child{margin-bottom:0}.scholar-pubs-review__count{font-weight:700;color:#0e7490}
          .scholar-pubs-review__list{list-style:none;margin:0;padding:0;display:grid;gap:12px}
          .scholar-pubs-review__list>.db-item{margin:0!important;width:auto!important;max-width:none!important}
          .scholar-geo-editor{margin:12px -1px -1px;padding:12px 14px 14px;border-top:1px dashed #d6d8d9;background:#f8fbfb;border-radius:0 0 10px 10px}
          .scholar-geo-editor__label{font-weight:700;color:#174852;font-size:.82rem;margin-bottom:7px}
          .scholar-geo-editor__row{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start}
          details.scholar-geo-menu{position:relative}
          details.scholar-geo-menu>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:7px;padding:7px 10px;border:1px solid #cbd5d8;border-radius:999px;background:#fff;color:#174852;font-size:.8rem;font-weight:600;user-select:none}
          details.scholar-geo-menu>summary::-webkit-details-marker{display:none}
          details.scholar-geo-menu[open]>summary{border-color:#0e7490;box-shadow:0 0 0 2px rgba(14,116,144,.10)}
          .scholar-geo-menu__count{display:none;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#0e7490;color:#fff;align-items:center;justify-content:center;font-size:.68rem}
          .scholar-geo-menu.has-selection .scholar-geo-menu__count{display:inline-flex}
          .scholar-geo-options{position:absolute;z-index:60;top:calc(100% + 5px);left:0;width:280px;max-height:300px;overflow:auto;padding:8px;background:#fff;border:1px solid #cbd5d8;border-radius:10px;box-shadow:0 10px 26px rgba(0,0,0,.15)}
          .scholar-geo-option{display:flex;gap:8px;align-items:flex-start;padding:6px 7px;border-radius:7px;font-size:.8rem;color:#374151;cursor:pointer}
          .scholar-geo-option:hover{background:#eaf7f9}.scholar-geo-option input{margin-top:2px;accent-color:#0e7490}
          .scholar-geo-option--general{border-bottom:1px dashed #d8dfe0;margin-bottom:4px;padding-bottom:8px;font-weight:600}
          .scholar-geo-editor__status{font-size:.75rem;color:#6b7280;margin-top:7px}
          .scholar-geo-submit{margin-top:16px;padding:16px 18px;background:#fff;border:1px solid rgba(14,116,144,.20);border-radius:14px}
          .scholar-geo-submit__grid{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:10px;margin:10px 0}
          .scholar-geo-submit label{display:block;font-size:.78rem;font-weight:700;color:#174852;margin-bottom:4px}.scholar-geo-submit input,.scholar-geo-submit select{width:100%;box-sizing:border-box;padding:9px 10px;border:1px solid #cbd5d8;border-radius:8px;background:#fff;font:inherit;font-size:.84rem}
          .scholar-geo-submit__actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.scholar-geo-submit button{border:0;border-radius:8px;padding:9px 15px;background:#0e7490;color:#fff;font-weight:700;cursor:pointer}.scholar-geo-submit button:disabled{opacity:.55;cursor:wait}
          .scholar-geo-submit__state{font-size:.8rem;color:#6b7280}.scholar-geo-submit__state.is-ok{color:#15803d;font-weight:600}.scholar-geo-submit__state.is-error{color:#b91c1c;font-weight:600}
          @media(max-width:700px){.scholar-direct-about,.scholar-pubs-review__head{padding:14px 15px}.scholar-geo-submit__grid{grid-template-columns:1fr}.scholar-geo-options{position:fixed;left:10px;right:10px;top:auto;width:auto;max-height:45vh}}
        `;
        d.head.appendChild(style);
      }

      function buildAboutBlock(d) {
        var box = d.createElement('section');
        box.className = 'scholar-direct-about';
        box.innerHTML = '<p>This database has been curated by <a href="index.html" target="_blank" rel="noopener">Professor Ron Vave</a>, an <em>iTaukei</em> (Indigenous Fijian) faculty member at the University of Hawai\u02bbi at M\u0101noa, in an effort to highlight and elevate the scholarly research and contributions of iTaukei postgraduates and researchers \u2014 in Fiji and around the world. It is not comprehensive, and is slowly being added to over time as a passion, side project. Beyond elevating our iTaukei researchers and their publications, the hope is that it will help with networking and collaboration \u2014 and perhaps mentorship for up-and-coming iTaukei students thinking of pursuing postgraduate studies, academia, or research more broadly.</p>';
        return box;
      }

      function findProfile(state, scholarId) {
        var hit = null;
        if (!state || !state.scholarProfilesByName || typeof state.scholarProfilesByName.forEach !== 'function') return null;
        state.scholarProfilesByName.forEach(function (p, key) {
          if (!hit && p && String(p.scholarId || '').toUpperCase() === scholarId) hit = { key:key, profile:p };
        });
        return hit;
      }

      function getScholarName(main, profile) {
        var n = main.querySelector('.db-scholar-card__name');
        if (n && n.textContent.trim()) return n.textContent.trim().replace(/^(Dr|Prof|Mr|Mrs|Ms)\.?\s+/i, '');
        return [profile && profile.first || '', profile && profile.last || ''].join(' ').trim() || 'iTaukei scholar';
      }

      function prepareScholarPublicationFilter(w, state, scholarKey) {
        if (!state || !state.filter || !scholarKey) return;
        state.filter.q = '';
        state.filter.itemType = '';
        state.filter.discipline = '';
        state.filter.decade = '';
        state.filter.province = '';
        state.filter.paternal = '';
        state.filter.university = '';
        state.filter.year = '';
        state.filter.scholar = scholarKey;
        state.shown = 10000;
        try {
          if (typeof w.__mfAfterFilterChange === 'function') w.__mfAfterFilterChange();
        } catch (_) {}
      }

      function scholarItems(state, scholarKey) {
        if (!state || !state.snapshot || !Array.isArray(state.snapshot.items)) return [];
        return state.snapshot.items.filter(function (it) {
          var set = state.scholarByItem && state.scholarByItem.get(it.key);
          return !!(set && set.has(scholarKey));
        }).sort(function (a,b) {
          return (Number(b.year || 0) - Number(a.year || 0)) || String(a.title || '').localeCompare(String(b.title || ''));
        });
      }

      function buildPublicationReviewWhenReady(w, d, main, state, scholarId, scholarKey, scholarName, card) {
        var expected = parseInt((card.querySelector('.db-scholar-card__stat-num') || {}).textContent || '0', 10) || 0;
        var attempts = 0;
        var timer = setInterval(function () {
          attempts += 1;
          try {
            state.shown = 10000;
            if (typeof w.__mfAfterFilterChange === 'function') w.__mfAfterFilterChange();
            var source = d.querySelector('[data-db-items]');
            var items = scholarItems(state, scholarKey);
            var rendered = source ? source.children.length : 0;
            if (source && items.length && rendered >= Math.min(items.length, expected || items.length)) {
              clearInterval(timer);
              buildPublicationReview(d, main, state, scholarId, scholarName, items, source, expected);
            } else if (attempts > 80) {
              clearInterval(timer);
              if (source && items.length) buildPublicationReview(d, main, state, scholarId, scholarName, items, source, expected);
            }
          } catch (_) {
            if (attempts > 80) clearInterval(timer);
          }
        }, 150);
      }

      var FIJI_PROVINCES = ['Ba','Bua','Cakaudrove','Kadavu','Lau','Lomaiviti','Macuata','Nadroga/Navosa','Naitasiri','Namosi','Ra','Rewa','Serua','Tailevu'];
      var PACIFIC_COUNTRIES = ['American Samoa','Cook Islands','Federated States of Micronesia','French Polynesia','Guam','Kiribati','Marshall Islands','Nauru','New Caledonia','Niue','Northern Mariana Islands','Palau','Papua New Guinea','Pitcairn Islands','Samoa','Solomon Islands','Tokelau','Tonga','Tuvalu','Vanuatu','Wallis and Futuna'];

      function buildPublicationReview(d, main, state, scholarId, scholarName, items, source, expected) {
        if (main.querySelector('.scholar-pubs-review')) return;
        var section = d.createElement('section');
        section.className = 'scholar-pubs-review';
        var head = d.createElement('div');
        head.className = 'scholar-pubs-review__head';
        var countText = items.length + (expected && expected !== items.length ? ' of ' + expected : '');
        head.innerHTML = '<h2>Publications currently linked to this scholar</h2>' +
          '<p><span class="scholar-pubs-review__count">' + countText + ' publications</span> are shown below using the same records, publication-type colors and working DOI/source/Zotero links as the main dashboard.</p>' +
          '<p><strong>Please help us geotag the research.</strong> For each thesis, book, book chapter, journal article or report, you can identify the Fiji province or provinces where the study was undertaken. Use <strong>Fiji \u2014 general/national study</strong> where the work concerns Fiji broadly and is not tied to a particular province. Where relevant, you can also identify another Pacific Island country or territory where the research was undertaken.</p>' +
          '<p>Geotagging allows publications to appear when the database is filtered by province. This means provincial governments and other stakeholders \u2014 including Non-Government Organizations (NGOs), Civil Society Organizations (CSOs), and local communities themselves \u2014 can more easily find research undertaken in their province and, where useful, draw on that information in planning and decision making. Geographic suggestions are reviewed before they are added to the database.</p>';
        section.appendChild(head);

        var list = d.createElement('ol');
        list.className = 'scholar-pubs-review__list';
        section.appendChild(list);

        var sourceNodes = Array.prototype.slice.call(source.children);
        var dirty = new Map();
        items.forEach(function (item, idx) {
          var node = sourceNodes[idx] ? sourceNodes[idx].cloneNode(true) : fallbackPublicationCard(d, item);
          var editor = buildGeoEditor(d, state, item, dirty);
          node.appendChild(editor);
          list.appendChild(node);
        });

        section.appendChild(buildGeoSubmit(d, scholarId, scholarName, dirty));
        main.appendChild(section);
      }

      function fallbackPublicationCard(d, item) {
        var li = d.createElement('li');
        li.className = 'db-item';
        var title = d.createElement('p'); title.className = 'db-item__title';
        var a = d.createElement('a'); a.target = '_blank'; a.rel = 'noopener';
        a.href = item.DOI ? 'https://doi.org/' + item.DOI : (item.url || 'https://www.zotero.org/groups/5983386/itaukei_academic_research/items/' + item.key);
        a.textContent = item.title || '(untitled)'; title.appendChild(a); li.appendChild(title);
        if (item.creators && item.creators.length) { var au=d.createElement('p'); au.className='db-item__authors'; au.textContent=item.creators.join(', '); li.appendChild(au); }
        var meta=d.createElement('p'); meta.className='db-item__meta'; meta.textContent=[item.year,item.publicationTitle||item.university].filter(Boolean).join(' \u00b7 '); li.appendChild(meta);
        return li;
      }

      function buildGeoEditor(d, state, item, dirty) {
        var wrap = d.createElement('div');
        wrap.className = 'scholar-geo-editor';
        wrap.innerHTML = '<div class="scholar-geo-editor__label">Where was this study/research undertaken?</div>';
        var row = d.createElement('div'); row.className = 'scholar-geo-editor__row'; wrap.appendChild(row);

        var existing = new Set();
        try { var ps = state.provincesByItem && state.provincesByItem.get(item.key); if (ps) ps.forEach(function (p) { existing.add(p); }); } catch (_) {}
        var provinceMenu = buildCheckMenu(d, 'Fiji province(s)', [{value:'Fiji — general/national study',label:'Fiji — general/national study',general:true}].concat(FIJI_PROVINCES.map(function (p) { return {value:p,label:p}; })), existing, function () { markDirty(); });
        provinceMenu.details.dataset.kind = 'province';
        row.appendChild(provinceMenu.details);

        var countryMenu = buildCheckMenu(d, 'Pacific Island country', PACIFIC_COUNTRIES.map(function (c) { return {value:c,label:c}; }), new Set(), function () { markDirty(); });
        countryMenu.details.dataset.kind = 'country';
        row.appendChild(countryMenu.details);

        var status = d.createElement('div'); status.className = 'scholar-geo-editor__status';
        status.textContent = existing.size ? 'Existing province tag(s) are pre-selected. Change them only if needed.' : 'No province tag is currently shown for this publication.';
        wrap.appendChild(status);

        function markDirty() {
          var provinces = provinceMenu.values();
          var countries = countryMenu.values();
          dirty.set(item.key, { item_key:item.key, title:item.title || '', year:item.year || '', provinces:provinces, pacific_countries:countries });
          status.textContent = 'Geographic suggestion changed — it will be included when you submit below.';
          updateDirtyCounter(d, dirty.size);
        }
        return wrap;
      }

      function buildCheckMenu(d, label, options, selected, onChange) {
        var details = d.createElement('details'); details.className = 'scholar-geo-menu';
        var summary = d.createElement('summary');
        summary.innerHTML = '<span>' + label + '</span><span class="scholar-geo-menu__count"></span><span aria-hidden="true">\u25be</span>';
        details.appendChild(summary);
        var panel = d.createElement('div'); panel.className = 'scholar-geo-options'; details.appendChild(panel);
        options.forEach(function (opt) {
          var lab = d.createElement('label'); lab.className = 'scholar-geo-option' + (opt.general ? ' scholar-geo-option--general' : '');
          var cb = d.createElement('input'); cb.type = 'checkbox'; cb.value = opt.value; cb.checked = selected && selected.has(opt.value);
          var span = d.createElement('span'); span.textContent = opt.label;
          lab.appendChild(cb); lab.appendChild(span); panel.appendChild(lab);
          cb.addEventListener('change', function () { syncCount(); onChange(); });
        });
        function values() { return Array.prototype.slice.call(panel.querySelectorAll('input:checked')).map(function (c) { return c.value; }); }
        function syncCount() { var n=values().length; details.classList.toggle('has-selection', n>0); summary.querySelector('.scholar-geo-menu__count').textContent=n; }
        syncCount();
        return { details:details, values:values };
      }

      function updateDirtyCounter(d, n) {
        var el = d.querySelector('[data-geo-dirty-count]');
        if (el) el.textContent = n + ' publication' + (n === 1 ? '' : 's') + ' changed';
      }

      function buildGeoSubmit(d, scholarId, scholarName, dirty) {
        var box = d.createElement('div');
        box.className = 'scholar-geo-submit';
        box.innerHTML = '<strong>Submit publication geography for review</strong><div class="scholar-geo-submit__grid">' +
          '<div><label>Your name *</label><input type="text" data-geo-submit-name required></div>' +
          '<div><label>Your email *</label><input type="email" data-geo-submit-email required></div>' +
          '<div><label>Relationship to this scholar *</label><select data-geo-submit-rel><option value="self">This is my own profile</option><option value="family">Family / relative</option><option value="colleague">Colleague / collaborator</option><option value="student">Student / mentee</option><option value="supervisor">Supervisor / advisor</option><option value="community">Community member</option><option value="other">Other</option></select></div>' +
          '</div><div class="scholar-geo-submit__actions"><button type="button" data-geo-submit-button>Submit geography for review</button><span class="scholar-geo-submit__state" data-geo-dirty-count>0 publications changed</span><span class="scholar-geo-submit__state" data-geo-submit-state></span></div>';
        var btn = box.querySelector('[data-geo-submit-button]');
        btn.addEventListener('click', async function () {
          var name = box.querySelector('[data-geo-submit-name]').value.trim();
          var email = box.querySelector('[data-geo-submit-email]').value.trim();
          var rel = box.querySelector('[data-geo-submit-rel]').value;
          var stateEl = box.querySelector('[data-geo-submit-state]');
          stateEl.className = 'scholar-geo-submit__state';
          if (!name || !email) { stateEl.textContent = 'Please enter your name and email.'; stateEl.classList.add('is-error'); return; }
          if (!dirty.size) { stateEl.textContent = 'No publication geography has been changed yet.'; stateEl.classList.add('is-error'); return; }
          btn.disabled = true; stateEl.textContent = 'Submitting…';
          var payload = Array.from(dirty.values());
          var fd = new FormData();
          fd.append('_subject', 'iTaukei scholar publication-geography review — ' + scholarName + ' (' + scholarId + ')');
          fd.append('_captcha', 'false');
          fd.append('_template', 'table');
          fd.append('submitter_name', name);
          fd.append('submitter_email', email);
          fd.append('submitter_relationship', rel);
          fd.append('scholar_id', scholarId);
          fd.append('scholar_name', scholarName);
          fd.append('profile_url', location.href);
          fd.append('publication_geography_json', JSON.stringify(payload, null, 2));
          try {
            var r = await fetch('https://formsubmit.co/ajax/ronvave2011@gmail.com', { method:'POST', body:fd, headers:{'Accept':'application/json'} });
            if (!r.ok) throw new Error('Submission failed');
            dirty.clear(); updateDirtyCounter(d, 0);
            stateEl.textContent = 'Submitted for review. Thank you.'; stateEl.classList.add('is-ok');
          } catch (e) {
            stateEl.textContent = 'Could not submit right now. Please try again.'; stateEl.classList.add('is-error');
          } finally { btn.disabled = false; }
        });
        return box;
      }
    })();
  </script>
</body>
</html>
